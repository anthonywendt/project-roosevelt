
components:
  terraform:
    core-identity-authorization:
      settings:
        providers:
          - "uds"
        depends_on:
          1:
            component: "core-base"
      vars:
        package_requirements:
          source: "oci://ghcr.io/defenseunicorns/packages/uds/core-identity-authorization:{{.vars.uds_version}}"
          package_vars: {}
        package_overrides:
          - component_name: "authservice"
            chart_name: "authservice"
            values:
              - path: "replicaCount"
                value: 1

          - component_name: "keycloak"
            chart_name: "keycloak"
            values:
              - path: "devMode"
                value: true
              - path: "resources.requests.memory"
                value: "512Mi"
              - path: "resources.requests.cpu"
                value: "100m"
              - path: "resources.limits.memory"
                value: "1Gi"
              - path: "resources.limits.cpu"
                value: "1000m"
              - path: "waypoint.horizontalPodAutoscaler.enabled"
                value: false
              - path: "waypoint.deployment.requests.cpu"
                value: "100m"
              - path: "waypoint.deployment.requests.memory"
                value: "64Mi"
              - path: "realmInitEnv.GOOGLE_IDP_ENABLED"
                value: "true"
              - path: "realmInitEnv.GOOGLE_IDP_ID"
                value: "C01881u7t"
              - path: "realmInitEnv.GOOGLE_IDP_SIGNING_CERT"
                value: ""
              - path: "realmInitEnv.GOOGLE_IDP_NAME_ID_FORMAT"
                value: "urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified"
              - path: "realmInitEnv.GOOGLE_IDP_CORE_ENTITY_ID"
                value: "https://sso.uds.dev/realms/uds"
              - path: "realmInitEnv.GOOGLE_IDP_ADMIN_GROUP"
                value: "uds-core-dev-admin"
              - path: "realmInitEnv.GOOGLE_IDP_AUDITOR_GROUP"
                value: "uds-core-dev-auditor"
              - path: "env"
                value: |
                  - name: JAVA_OPTS_KC_HEAP
                    value: "-XX:MaxRAMPercentage=70 -XX:MinRAMPercentage=70 -XX:InitialRAMPercentage=50 -XX:MaxRAM=1G"
