
components:
  terraform:
    core-identity-authorization:
      settings:
        providers:
          - "uds"
      vars:
        package_requirements:
          source: "oci://ghcr.io/defenseunicorns/packages/uds/core-identity-authorization:{{.vars.uds_version}}"
          package_vars: {}
        package_overrides_map:
          # 1st key = UDS package component name
          # (maps to Terraform uds_package.component.name)
          authservice:
            # 2nd key = Helm chart name inside that component
            # (maps to Terraform uds_package.component.override.chart_name)
            authservice:
              # Non-sensitive chart values
              values:
                replicaCount: 1

          keycloak:
            keycloak:
              values:
                devMode: true
                resources.requests.memory: "512Mi"
                resources.requests.cpu: "100m"
                resources.limits.memory: "1Gi"
                resources.limits.cpu: "1000m"
                waypoint.horizontalPodAutoscaler.enabled: false
                waypoint.deployment.requests.cpu: "100m"
                waypoint.deployment.requests.memory: "64Mi"
                realmInitEnv.GOOGLE_IDP_ENABLED: "true"
                realmInitEnv.GOOGLE_IDP_ID: "C01881u7t"
                realmInitEnv.GOOGLE_IDP_SIGNING_CERT: ""
                realmInitEnv.GOOGLE_IDP_NAME_ID_FORMAT: "urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified"
                realmInitEnv.GOOGLE_IDP_CORE_ENTITY_ID: "https://sso.uds.dev/realms/uds"
                realmInitEnv.GOOGLE_IDP_ADMIN_GROUP: "uds-core-dev-admin"
                realmInitEnv.GOOGLE_IDP_AUDITOR_GROUP: "uds-core-dev-auditor"
                env: |
                  - name: JAVA_OPTS_KC_HEAP
                    value: "-XX:MaxRAMPercentage=70 -XX:MinRAMPercentage=70 -XX:InitialRAMPercentage=50 -XX:MaxRAM=1G"
