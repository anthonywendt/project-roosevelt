components:
  terraform:
    uds-k3d:
      settings:
        providers:
          - "uds"
        init_run: false
      vars:
        package_requirements:
          source: "oci://ghcr.io/defenseunicorns/packages/uds-k3d:{{.vars.uds_k3d_version}}"
          package_vars: {}
        package_overrides:
          - component_name: "uds-dev-stack"
            chart_name: "minio"
            values:
              - path: "buckets[0]"
                value: "test-b-1"
              - path: "buckets[1]"
                value: "test-b-2"
              - path: "svcaccts[0]"
                value: "test-svcacct-1"
              - path: "svcaccts[1]"
                value: "test-svcacct-2"
              - path: "users[0]"
                value: "test-user-1"
              - path: "users[1]"
                value: "test-user-2"
              - path: "policies[0]"
                value: "test-policy-1"
              - path: "policies[1]"
                value: "test-policy-2"
