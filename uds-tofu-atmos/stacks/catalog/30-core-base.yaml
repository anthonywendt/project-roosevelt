components:
  terraform:
    core-base:
      settings:
        providers:
          - "uds"
      vars:
        package_requirements:
          source: "oci://ghcr.io/defenseunicorns/packages/uds/core-base:{{.vars.uds_version}}"
          package_vars: {}
          components:
            # - name: "istio-passthrough-gateway" # uncomment to deploy optional component for this dev-to-prd workflow
            # - name: "istio-egress-gateway" # uncomment to deploy optional component for this dev-to-prd workflow
        package_overrides_map:
          # 1st key = UDS package component name
          # (maps to Terraform uds_package.component.name)
          pepr-uds-core:
            # 2nd key = Helm chart name inside that component
            # (maps to Terraform uds_package.component.override.chart_name)
            module:
              # Non-sensitive chart values
              values:
                additionalIgnoredNamespaces: |
                  - uds-dev-stack
                watcher.resources.requests.memory: "64Mi"
                admission.resources.requests.memory: "64Mi"
                watcher.resources.requests.cpu: "100m"
                admission.resources.requests.cpu: "100m"

          istio-controlplane:
            istiod:
              values:
                resources.requests.memory: "1024Mi"
                resources.requests.cpu: "100m"
                global.proxy.resources.requests.memory: "40Mi"
                global.proxy.resources.limits.memory: "1024Mi"
                global.proxy.resources.requests.cpu: "10m"
                global.proxy.resources.limits.cpu: "2000m"

          istio-admin-gateway:
            uds-istio-config:
              values:
                tls.supportTLSV1_2: false
