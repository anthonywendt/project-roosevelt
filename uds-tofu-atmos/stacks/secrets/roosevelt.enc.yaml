# Environment level sensitive overrides for this stack
components:
    terraform:
        podinfo:
            vars:
                package_overrides_map:
                    # 1st key = UDS package component name
                    # (maps to Terraform uds_package.component.name)
                    podinfo:
                        # 2nd key = Helm chart name inside that component
                        # (maps to Terraform uds_package.component.override.chart_name)
                        # It is also "podinfo" here because the component and chart share the same name.
                        podinfo:
                            sensitive_values:
                                ui.message: This is a sensitive message!!
